name: Validate application
on:
  push:
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build
        env:
          REACT_APP_FIREBASE_API_KEY: documentation-placeholder
          REACT_APP_FIREBASE_PROJECT_ID: documentation-placeholder
